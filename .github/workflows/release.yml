name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.2)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A step's own `env:` is not in scope for that step's `if:`, so the
    # publish guards must read a job-level value. These are booleans, not
    # the tokens: keeping the secrets at step level means `npm ci` never
    # has them in its environment.
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve tag
        id: tag
        run: |
          # On workflow_dispatch, github.ref_name is the branch (e.g. master),
          # so prefer the explicit input; on a tag push, ref_name is the tag.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::package.json version v${PKG_VERSION} does not match tag ${TAG}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package VSIX
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="flaunt-github-${VERSION}.vsix"
          npx vsce package --no-dependencies --out "${VSIX}"
          echo "vsix=${VSIX}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.package.outputs.vsix }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}

      - name: Publish to Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ steps.package.outputs.vsix }}" -p "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "${{ steps.package.outputs.vsix }}"

      - name: Publish summary
        run: |
          if [ "${HAS_VSCE_PAT}" != "true" ]; then
            echo "::notice::VSCE_PAT not set - Marketplace publish skipped. Run:"
            echo "::notice::  npx vsce publish --packagePath ${{ steps.package.outputs.vsix }}"
          fi
          if [ "${HAS_OVSX_PAT}" != "true" ]; then
            echo "::notice::OVSX_PAT not set - Open VSX publish skipped."
          fi
