name: Auto-tag on version bump

on:
  push:
    branches: [master, main]

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    # Skip commits authored by this workflow to avoid recursion.
    if: "!contains(github.event.head_commit.message, 'chore: tag v')"
    steps:
      # Shallow checkout is enough — the tag check and creation both go through
      # the API now, so no local history or tags are needed.
      - uses: actions/checkout@v7

      - name: Read version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Tags are created through the REST API rather than `git push origin <tag>`.
      # The git path began rejecting tag pushes with `remote: Internal Server
      # Error` (reproducibly, with no ruleset or tag protection configured),
      # which silently blocked the v3.0.11 release. The API path is unaffected.
      - name: Tag if new
        id: tagstep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Tag ${TAG} already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG_SHA="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" \
            -f message="Release ${TAG}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            -q .sha)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_SHA}" >/dev/null
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Created tag ${TAG} at ${GITHUB_SHA} via the REST API."

      # A tag pushed with GITHUB_TOKEN does NOT fire the Release workflow's
      # `on: push: tags` trigger (GitHub blocks recursive event triggering).
      # Dispatch it explicitly instead — workflow_dispatch via the API is not
      # subject to that restriction (needs `actions: write`).
      - name: Trigger Release workflow
        if: steps.tagstep.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml -f tag="${{ steps.pkg.outputs.tag }}"
          echo "::notice::Dispatched Release workflow for ${{ steps.pkg.outputs.tag }}."
